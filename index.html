  <style>

    .login-box {

<body>

  <!-- PASSWORD SCREEN -->
  <section id="passwordScreen">
    <div class="login-box">
      <h1>🎬 My Movies</h1>
      <p>Enter your password to unlock your movie library.</p>

      <form id="passwordForm">
        <div class="password-row">
          <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="show-button"
            id="togglePassword"
          >Show</button>
        </div>

        <button type="submit" class="primary-button">
          🔓 Unlock App
        </button>

        <p id="passwordError" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- MAIN MOVIE APP -->
  <main id="movieApp" class="hidden">
    <header>
      <h1>🎬 My Movies App</h1>

      <div class="header-actions">
        <button class="small-button" id="lockButton">
          🔒 Lock
        </button>
      </div>
    </header>

    <div class="container">
      <div class="toolbar">
        <input
          type="search"
          id="search"
          placeholder="🔍 Search your movies..."
          aria-label="Search movies"
        >

        <label class="upload-label" for="movieUpload">
          ➕ Add Movies
        </label>

        <input
          type="file"
          id="movieUpload"
          accept="video/*,.mp4,.webm,.ogg,.mov,.m4v"
          multiple
        >
      </div>

      <p id="status" aria-live="polite">
        Welcome to your movie library!
      </p>

      <section id="movieGrid" class="movie-grid">
        <p id="emptyMessage">
          No movies added yet. Click “Add Movies” to select videos.
        </p>
      </section>
    </div>

    <footer>🎥 My Movies App</footer>
  </main>

  <script>
    /* ================= PASSWORD ================= */

    const APP_PASSWORD = "varmateja";

    const passwordScreen =
      document.getElementById("passwordScreen");

    const passwordInput =
      document.getElementById("passwordInput");

    const passwordError =
      document.getElementById("passwordError");

    const movieApp =
      document.getElementById("movieApp");

    const passwordForm =
      document.getElementById("passwordForm");

    function checkPassword(event) {
      if (event) event.preventDefault();

      if (passwordInput.value === APP_PASSWORD) {
        passwordScreen.classList.add("hidden");
        movieApp.classList.remove("hidden");

        passwordError.textContent = "";
        passwordInput.value = "";

        document.getElementById("search").focus();
      } else {
        passwordError.textContent = "❌ Wrong password. Try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    passwordForm.addEventListener("submit", checkPassword);

    document
      .getElementById("togglePassword")
      .addEventListener("click", function () {
        const showing = passwordInput.type === "text";

        passwordInput.type = showing ? "password" : "text";
        this.textContent = showing ? "Show" : "Hide";
      });

    document
      .getElementById("lockButton")
      .addEventListener("click", function () {
        movieApp.classList.add("hidden");
        passwordScreen.classList.remove("hidden");
        passwordError.textContent = "";
        passwordInput.value = "";
        passwordInput.focus();
      });


    /* ================= MOVIE SEARCH ================= */

    const searchInput = document.getElementById("search");
    const movieGrid = document.getElementById("movieGrid");
    const status = document.getElementById("status");
    const movieUpload = document.getElementById("movieUpload");

    // Each entry holds a video URL for this browser session.
    const movies = [];

    function searchMovie() {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      movies.forEach(function (movie) {
        const matches = movie.title.toLowerCase().includes(query);

        movie.card.classList.toggle("hidden", !matches);

        if (matches) visibleCount++;
      });

      updateEmptyMessage(query, visibleCount);
    }

    searchInput.addEventListener("input", searchMovie);


    /* ================= MOVIE UPLOAD ================= */

    movieUpload.addEventListener("change", function () {
      const files = Array.from(this.files || []);
      let added = 0;

      files.forEach(function (file) {
        if (!file.type.startsWith("video/")) {
          return;
        }

        const movie = {
          title: file.name.replace(/\.[^/.]+$/, ""),
          url: URL.createObjectURL(file),
          card: null
        };

        movie.card = createMovieCard(movie);
        movies.push(movie);

        movieGrid.appendChild(movie.card);
        added++;
      });

      this.value = "";

      if (added > 0) {
        status.textContent =
          added + " movie(s) added. Videos are available in this session.";
      } else if (files.length > 0) {
        status.textContent = "Please select valid video files.";
      }

      searchMovie();
    });

    function createMovieCard(movie) {
      const card = document.createElement("article");
      card.className = "movie";

      const video = document.createElement("video");
      video.src = movie.url;
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;
      video.setAttribute("aria-label", movie.title);

      // Add an explicit fullscreen control for supported browsers.
      const info = document.createElement("div");
      info.className = "movie-info";

      const title = document.createElement("h3");
      title.textContent = movie.title;

      const actions = document.createElement("div");
      actions.className = "movie-actions";

      const fullscreenButton = document.createElement("button");
      fullscreenButton.type = "button";
      fullscreenButton.textContent = "⛶ Fullscreen";

      fullscreenButton.addEventListener("click", async function () {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (video.requestFullscreen) {
            await video.requestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          } else {
            status.textContent =
              "Fullscreen is not supported by this browser.";
          }
        } catch (error) {
          status.textContent =
            "Could not open fullscreen. Try the video's fullscreen control.";
        }
      });

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.textContent = "🗑 Remove";
      deleteButton.className = "delete-button";

      deleteButton.addEventListener("click", function () {
        video.pause();
        card.remove();

        const index = movies.indexOf(movie);
        if (index !== -1) movies.splice(index, 1);

        URL.revokeObjectURL(movie.url);
        status.textContent = "Movie removed from the library.";

        searchMovie();
      });

      actions.append(fullscreenButton, deleteButton);
      info.append(title, actions);
      card.append(video, info);

      return card;
    }


    /* ================= EMPTY / SEARCH MESSAGE ================= */

    function updateEmptyMessage(query, visibleCount) {
      let message = document.getElementById("emptyMessage");

      if (!message) {
        message = document.createElement("p");
        message.id = "emptyMessage";
        message.id = "emptyMessage";
        message.style.gridColumn = "1 / -1";
        message.style.textAlign = "center";
        message.style.padding = "35px 10px";
        message.style.color = "#aaa";
        movieGrid.appendChild(message);
      }

      if (movies.length === 0) {
        message.textContent =
          "No movies added yet. Click “Add Movies” to select videos.";
        message.classList.remove("hidden");
      } else if (visibleCount === 0) {
        message.textContent = query
          ? "No movies match your search."
          : "No movies available.";
        message.classList.remove("hidden");
      } else {
        message.classList.add("hidden");
      }
    }
  </script>

</body>
</html>
